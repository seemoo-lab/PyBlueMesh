[TPyNode]
logfile = /var/log/tpynode.log
pidfile = /var/run/tpynode.pid
host = 0.0.0.0
port = 42337
token = None

[OpenWrt]
module = OpenWrt

[wil6210iface]
module = WiGigInterface
interface = wlan2

[hostapd]
module = Hostapd
interface = wlan2

[wpasupplicant]
module = WPASupplicant
interface = wlan2

[IPerf]
bin = iperf3
logfile = /var/log/iperf.log
port = 5201