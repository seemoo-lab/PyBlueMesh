[TPyNode]
logfile = /var/log/tpynode.log
pidfile = /var/run/tpynode.pid
host = 0.0.0.0
port = 42337
token = None

[AdHocInterface]
interface = wlp1s0
ipaddress = auto
ipaddress_auto_dev = enp2s0
channel = 1
bssid = c0:ff:ee:c0:ff:ee
ssid = erlab
mode = HT20

[ClickCastor]
module = Click
bin = /root/milan/click-castor/userlevel/click
config = /root/milan/click-castor/conf/castor/castor_run_userlevel.click
logfile = /var/log/click.log
socket_port = 7777

[Ping]

[IPerf]
bin = iperf3
logfile = /var/log/iperf.log
port = 5201

[NTP]
server = click-mesh-boot.seemoo.tu-darmstadt.de
